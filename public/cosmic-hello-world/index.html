<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
    color: #fff;
    cursor: default;
    user-select: none;
  }

  canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  #start-prompt {
    position: fixed;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 20;
    animation: pulse 2.5s ease-in-out infinite;
    white-space: nowrap;
  }

  #final-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 4s ease-in;
  }
  #final-message.visible { opacity: 1; }
  #final-message h1 {
    font-size: clamp(24px, 5vw, 52px);
    font-weight: 400;
    letter-spacing: 8px;
    margin-bottom: 16px;
    text-shadow: 0 0 60px rgba(100,180,255,0.5);
  }
  #final-message p {
    font-size: clamp(10px, 1.4vw, 15px);
    color: rgba(255,255,255,0.35);
    font-weight: 400;
    letter-spacing: 2px;
  }

  #info-panel {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease-in;
  }
  #info-panel.visible { opacity: 1; }
  .signal-time {
    font-size: clamp(11px, 1.2vw, 14px);
    color: rgba(100, 180, 255, 0.7);
    letter-spacing: 2px;
  }
  .signal-distance {
    font-size: clamp(10px, 1vw, 12px);
    color: rgba(255,255,255,0.3);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .latest-reach {
    font-size: clamp(10px, 1vw, 12px);
    color: rgba(100,180,255,0.4);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  #restart-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    background: none;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 1s ease, color 0.3s ease, border-color 0.3s ease;
  }
  #restart-btn.visible { opacity: 1; }
  #restart-btn:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.25); }

  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="start-prompt">Click anywhere to transmit</div>
<div id="info-panel">
  <div class="signal-time" id="signal-time">T+0s</div>
  <div class="signal-distance" id="signal-distance">0 km</div>
  <div class="latest-reach" id="latest-reach"></div>
</div>
<div id="final-message">
  <h1>Hello, World.</h1>
  <p>Now 0.001% of the way to the nearest star.</p>
</div>
<button id="restart-btn">Restart</button>

<script>
// ============================================================
// COSMIC HELLO WORLD
// A radio signal from Earth, traveling at the speed of light
// ============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Constants ---
const C = 299792.458;        // speed of light, km/s
const AU = 149597870.7;      // 1 AU in km

// Time acceleration: 1 real second = TIME_SCALE simulated seconds
// At 600x: Moon ~0.64s, Mars ~12.5s, Jupiter ~43s, Neptune ~250s, Voyager ~550s → ~82 real seconds total
const TIME_SCALE = 600;

// Celestial bodies (distances from Earth, in AU)
const BODIES = [
  { name: 'Moon',      dist: 0.00257,  r: 2.5, color: '#c0c0c0', glow: '#aaa' },
  { name: 'Venus',     dist: 0.28,     r: 4,   color: '#e8c56d', glow: '#e8c56d' },
  { name: 'Mars',      dist: 0.52,     r: 3.5, color: '#c1440e', glow: '#e06030' },
  { name: 'Jupiter',   dist: 4.2,      r: 9,   color: '#c88b3a', glow: '#d4a050' },
  { name: 'Saturn',    dist: 8.5,      r: 7,   color: '#e8d68d', glow: '#e8d68d' },
  { name: 'Uranus',    dist: 18.2,     r: 5.5, color: '#7ec8e3', glow: '#7ec8e3' },
  { name: 'Neptune',   dist: 29.1,     r: 5.5, color: '#4863a0', glow: '#6b8dd6' },
  { name: 'Voyager 1', dist: 165,      r: 1.5, color: '#ffffff', glow: '#ffffff', isProbe: true },
];

// --- Logarithmic distance mapping ---
// Maps AU distance to screen pixels. Log scale ensures both the Moon and Voyager 1 are visible.
let maxScreenRadius; // pixels from center to edge of shortest dimension
function distToPixels(distAU) {
  // log1p maps: 0 → 0, and spreads out small values while compressing large ones
  // Tuned so Voyager 1 (165 AU) sits at ~90% of screen radius
  const logMax = Math.log1p(165);
  const logDist = Math.log1p(distAU);
  return (logDist / logMax) * maxScreenRadius * 0.88;
}

// State
let centerX, centerY;
let stars = [];
let started = false;
let finished = false;
let simTime = 0;
let signalRadiusKm = 0;
let reachedBodies = new Map();
let bodyAngles = [];
let lastTimestamp = null;
let labelAnimations = new Map();
let transmitPulseTime = null;

// --- Resize ---
function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  centerX = window.innerWidth / 2;
  centerY = window.innerHeight / 2;
  maxScreenRadius = Math.min(window.innerWidth, window.innerHeight) / 2;
  generateStars();
}

// --- Stars ---
function generateStars() {
  stars = [];
  const count = Math.floor((window.innerWidth * window.innerHeight) / 600);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.4 + 0.2,
      brightness: Math.random() * 0.5 + 0.15,
      twinkleSpeed: Math.random() * 0.015 + 0.003,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

function initBodyAngles() {
  bodyAngles = BODIES.map((_, i) => {
    // Spread them out somewhat evenly but with randomness
    return (i / BODIES.length) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
  });
}

// --- Drawing ---
function drawStars(time) {
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset);
    const a = s.brightness * (0.4 + 0.6 * tw);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(centerX, centerY, maxScreenRadius * 0.3, centerX, centerY, maxScreenRadius * 1.6);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
}

function drawEarth(time) {
  // Transmission pulse
  if (transmitPulseTime !== null) {
    const elapsed = time - transmitPulseTime;
    if (elapsed < 2) {
      const pulseR = elapsed * 40;
      const pulseA = Math.max(0, 0.4 * (1 - elapsed / 2));
      const pg = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulseR);
      pg.addColorStop(0, `rgba(100,180,255,${pulseA})`);
      pg.addColorStop(1, 'rgba(100,180,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(centerX, centerY, pulseR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Ambient glow
  const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 28);
  glow.addColorStop(0, 'rgba(80, 160, 255, 0.25)');
  glow.addColorStop(0.5, 'rgba(40, 100, 200, 0.08)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 28, 0, Math.PI * 2);
  ctx.fill();

  // Earth body
  const eg = ctx.createRadialGradient(centerX - 1.5, centerY - 1.5, 0, centerX, centerY, 5.5);
  eg.addColorStop(0, '#6db3f2');
  eg.addColorStop(0.6, '#2e86de');
  eg.addColorStop(1, '#1a5276');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '9px "Space Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('EARTH', centerX, centerY + 16);
}

function getBodyScreenPos(i) {
  const b = BODIES[i];
  const angle = bodyAngles[i];
  const px = distToPixels(b.dist);
  return { x: centerX + Math.cos(angle) * px, y: centerY + Math.sin(angle) * px };
}

function drawBody(i, time) {
  const body = BODIES[i];
  const pos = getBodyScreenPos(i);
  const reached = reachedBodies.get(body.name);
  const orbitPx = distToPixels(body.dist);

  // Orbit ring
  if (!body.isProbe) {
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(centerX, centerY, orbitPx, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Glow when signal arrives
  let glowAlpha = 0;
  if (reached) {
    const t = Math.min((time - reached.time) / 2, 1);
    glowAlpha = t;

    const gr = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, body.r * 6);
    gr.addColorStop(0, withAlpha(body.glow, glowAlpha * 0.4));
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, body.r * 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Body
  const baseAlpha = reached ? 0.4 + glowAlpha * 0.6 : 0.18;
  ctx.fillStyle = withAlpha(body.color, baseAlpha);
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, body.r, 0, Math.PI * 2);
  ctx.fill();

  // Saturn ring
  if (body.name === 'Saturn') {
    ctx.strokeStyle = withAlpha('#e8d68d', baseAlpha * 0.5);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, body.r * 2.2, body.r * 0.5, -0.3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Voyager — tiny crosshair instead of circle
  if (body.isProbe) {
    ctx.strokeStyle = withAlpha('#fff', baseAlpha);
    ctx.lineWidth = 0.5;
    const s = 4;
    ctx.beginPath();
    ctx.moveTo(pos.x - s, pos.y); ctx.lineTo(pos.x + s, pos.y);
    ctx.moveTo(pos.x, pos.y - s); ctx.lineTo(pos.x, pos.y + s);
    ctx.stroke();
  }

  // Labels on reach
  if (reached) {
    if (!labelAnimations.has(body.name)) labelAnimations.set(body.name, { startTime: time });
    const la = labelAnimations.get(body.name);
    const labelA = Math.min((time - la.startTime) / 2.5, 0.75);

    ctx.fillStyle = `rgba(255,255,255,${labelA})`;
    ctx.font = `${body.isProbe ? 8 : 9}px "Space Mono", monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(body.name.toUpperCase(), pos.x, pos.y - body.r - 10);

    // Light-travel time
    const ltSec = (body.dist * AU) / C;
    ctx.fillStyle = `rgba(100,180,255,${labelA * 0.55})`;
    ctx.font = '8px "Space Mono", monospace';
    ctx.fillText(formatLightTime(ltSec), pos.x, pos.y - body.r - 21);
  }
}

function drawSignal(time) {
  if (!started) return;

  const signalAU = signalRadiusKm / AU;
  const signalPx = distToPixels(signalAU);

  // Main ring + trailing rings
  const maxPx = distToPixels(170); // fade distance
  for (let i = 0; i < 3; i++) {
    const r = signalPx - i * 5;
    if (r <= 0) continue;
    const fade = Math.max(0, 1 - (r / maxPx) * 0.7);
    const alpha = fade * (0.35 - i * 0.10);
    if (alpha <= 0) continue;

    ctx.strokeStyle = `rgba(100, 180, 255, ${alpha})`;
    ctx.lineWidth = 1.8 - i * 0.4;
    ctx.beginPath();
    ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
    ctx.stroke();

    // Bloom on leading ring
    if (i === 0 && fade > 0.05) {
      const bg = ctx.createRadialGradient(centerX, centerY, Math.max(0, r - 3), centerX, centerY, r + 6);
      bg.addColorStop(0, 'rgba(100,180,255,0)');
      bg.addColorStop(0.5, `rgba(100,180,255,${alpha * 0.2})`);
      bg.addColorStop(1, 'rgba(100,180,255,0)');
      ctx.strokeStyle = bg;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// --- Collision ---
function checkSignalReach() {
  for (let i = 0; i < BODIES.length; i++) {
    const b = BODIES[i];
    if (reachedBodies.has(b.name)) continue;
    if (signalRadiusKm >= b.dist * AU) {
      reachedBodies.set(b.name, { time: performance.now() / 1000 });
      document.getElementById('latest-reach').textContent = `Signal reached ${b.name}`;
    }
  }
}

// --- Info panel ---
function updateInfoPanel() {
  const h = Math.floor(simTime / 3600);
  const m = Math.floor((simTime % 3600) / 60);
  const s = Math.floor(simTime % 60);

  let timeStr;
  if (h > 0) timeStr = `T+${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  else if (m > 0) timeStr = `T+${m}m ${String(s).padStart(2,'0')}s`;
  else timeStr = `T+${s}s`;
  document.getElementById('signal-time').textContent = timeStr;

  const distStr = signalRadiusKm < AU
    ? `${numberWithCommas(Math.floor(signalRadiusKm))} km`
    : `${(signalRadiusKm / AU).toFixed(2)} AU`;
  document.getElementById('signal-distance').textContent = distStr;
}

// --- Main loop ---
function frame(ts) {
  const time = ts / 1000;

  if (started && lastTimestamp !== null) {
    const dt = (ts - lastTimestamp) / 1000;
    simTime += dt * TIME_SCALE;
    signalRadiusKm = simTime * C;
    checkSignalReach();
    updateInfoPanel();

    if (signalRadiusKm > 165 * AU * 1.15 && !finished) {
      finished = true;
      document.getElementById('final-message').classList.add('visible');
      document.getElementById('restart-btn').classList.add('visible');
    }
  }
  lastTimestamp = ts;

  // Clear
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  drawStars(time);
  drawVignette();
  drawEarth(time);
  for (let i = 0; i < BODIES.length; i++) drawBody(i, time);
  drawSignal(time);

  requestAnimationFrame(frame);
}

// --- Utility ---
function withAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function numberWithCommas(x) {
  return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatLightTime(sec) {
  if (sec < 2) return `${sec.toFixed(1)}s light`;
  if (sec < 120) return `${Math.round(sec)}s light`;
  if (sec < 7200) return `${(sec / 60).toFixed(1)}m light`;
  return `${(sec / 3600).toFixed(1)}h light`;
}

// --- Init & events ---
function init() {
  resize();
  initBodyAngles();
  requestAnimationFrame(frame);
}

function startTransmission() {
  if (started) return;
  started = true;
  transmitPulseTime = performance.now() / 1000;
  document.getElementById('start-prompt').style.display = 'none';
  document.getElementById('info-panel').classList.add('visible');
  simTime = 0;
  signalRadiusKm = 0;
}

function restart() {
  started = false;
  finished = false;
  simTime = 0;
  signalRadiusKm = 0;
  lastTimestamp = null;
  transmitPulseTime = null;
  reachedBodies.clear();
  labelAnimations.clear();
  initBodyAngles();
  document.getElementById('final-message').classList.remove('visible');
  document.getElementById('restart-btn').classList.remove('visible');
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('latest-reach').textContent = '';
  document.getElementById('start-prompt').style.display = 'block';
}

window.addEventListener('resize', resize);
canvas.addEventListener('click', startTransmission);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); finished ? restart() : startTransmission(); }
});
document.getElementById('restart-btn').addEventListener('click', (e) => { e.stopPropagation(); restart(); });

init();
</script>
</body>
</html>
